    <!-- Страница дня с первого кадра (BootShell.jsx — та же разметка): до
         скриптов человек видит сегодняшнее число, а не пустой экран. Число
         ставит крошечный скрипт ниже — по местным часам телефона, как и само
         приложение. Приложение встаёт на это место, не сдвигая лист. -->
    <script>
      (function () {
        try {
          var M = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
          var W = ["воскресенье", "понедельник", "вторник", "среда", "четверг", "пятница", "суббота"];
          var d = new Date();
          document.getElementById("boot-day").textContent = d.getDate();
          document.getElementById("boot-month").textContent = M[d.getMonth()];
          document.getElementById("boot-weekday").textContent = W[d.getDay()];
        } catch (e) {}
      })();
    </script>
